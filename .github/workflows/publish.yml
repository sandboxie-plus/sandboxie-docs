name: Publish
permissions:
  contents: write
  deployments: write
on:
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13
    - name: Setup Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    - name: Prepare language directories
      run: python tools/prepare_docs.py --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/docs-build"
    - name: Build
      shell: pwsh
      run: ./tools/build_docs.ps1 -BuildRoot (Join-Path $env:RUNNER_TEMP 'docs-build')
    - name: Check rendered links
      run: python tools/check_site_links.py --site "$RUNNER_TEMP/docs-build/site"

    - name: Publish
      run: |-
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        ghp-import "$RUNNER_TEMP/docs-build/site" --push
    - uses: actions/upload-artifact@v7.0.1
      with:
        path: '${{ runner.temp }}/docs-build/site'
