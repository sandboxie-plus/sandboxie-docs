name: Build documentation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test documentation tools
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Prepare publishing inputs
        run: python tools/prepare_docs.py --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/docs-build"
      - name: Build publishing layout
        shell: pwsh
        run: ./tools/build_docs.ps1 -BuildRoot (Join-Path $env:RUNNER_TEMP 'docs-build')
      - name: Check rendered links
        run: python tools/check_site_links.py --site "$RUNNER_TEMP/docs-build/site"
